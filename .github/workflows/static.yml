# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Generate config.js from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Clean the URL: remove trailing slashes and /rest/v1 path if present
          CLEAN_URL=$(echo "$SUPABASE_URL" | sed 's|/rest/v1/*$||' | sed 's|/*$||')
          if [ -n "$CLEAN_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "window.SUPABASE_CONFIG = { url: '$CLEAN_URL', anonKey: '$SUPABASE_ANON_KEY' };" > config.js
            echo "✅ config.js generated with project URL: $CLEAN_URL"
          elif [ ! -f config.js ]; then
            echo "window.SUPABASE_CONFIG = { url: '', anonKey: '' };" > config.js
            echo "⚠️ No secrets found, generated empty config.js"
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
